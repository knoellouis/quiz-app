      <animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M90 13 L92 19 L98 21 L92 23 L90 29 L88 23 L82 21 L88 19Z">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M113 124 L114.5 128.5 L119 130 L114.5 131.5 L113 136 L111.5 131.5 L107 130 L111.5 128.5Z">
      <animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#f5cb73">
    <circle cx="23" cy="91" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="155" cy="76" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="19" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="61" cy="133" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
