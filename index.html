<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Thinkly</title>
  </head>
  <body>
    <header>
      <h1 class="App-title">Thinkly</h1>
    </header>
    <main>
      <article class="question-card">
        <h2 class="question-card__title">
          What is the name of the school that Harry Potter attends?
        </h2>
        <p class="question-card__answer-text">
          Hogwarts School of Witchcraft and Wizardry
        </p>
        <button class="question-card__answer-toggle">Show Answer</button>
        <ul class="question-card__tags">
          <li class="question-card__tag">Harry Potter</li>
          <li class="question-card__tag">Hogwarts</li>
          <li class="question-card__tag">Fiction</li>
        </ul>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
