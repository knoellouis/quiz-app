<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Thinkly - Profile</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">
      <span>Skip to main content </span></a
    >
    <header class="app__header">
      <h1 class="app__title">Thinkly</h1>
    </header>
    <main id="main-content">
      <section id="about" class="about">
        <div>
          <img
            src="./Assets/profile.svg"
            alt="user profile image"
            class="about__image"
          />
          <h2>Keikeidi</h2>
        </div>
        <h3>About me</h3>
        <p>
          Professional overthinker, part-time snack enthusiast, and full-time
          trivia legend (in my own head). I know a little about a lot, a lot
          about nothing, and somehow always forget why I walked into a room.
          🧠✨
        </p>
      </section>
      <section></section>
      <section id="settings">
        <h2>Settings</h2>
        <div class="setting">
          <label for="dark-mode">Dark mode</label>
          <input
            type="checkbox"
            id="dark-mode"
            name="dark-mode"
            role="switch"
          />
        </div>
      </section>
    </main>
    <footer>
      <nav aria-label="Main navigation">
        <ul class="nav">
          <li class="nav__item">
            <a href="index.html" aria-current="page" aria-label="Home"
              ><img
                src="./Assets/home.svg"
                alt="home icon"
                aria-label="home icon"
            /></a>
          </li>
          <li class="nav__item">
            <a href="bookmarks.html" aria-label="Bookmarks"
              ><img
                src="./Assets/bookmark.svg"
                alt="bookmarks icon"
                aria-label="bookmarks icon"
            /></a>
          </li>
          <li class="nav__item">
            <a href="profile.html" aria-label="Profile"
              ><img
                src="./Assets/profile.svg"
                alt="profile icon"
                aria-label="profile icon"
            /></a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
