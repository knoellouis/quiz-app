<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Thinkly - Profile</title>
  </head>
  <body class="app">
    <a class="skip-link" href="#main-content">
      <span>Skip to main content </span></a
    >
    <header class="app__header">
      <h1 class="app__title">Thinkly ⚡️</h1>
    </header>
    <main id="main-content">
      <section id="about" class="about" aria-labelledby="about__headline">
        <div class="about__user">
          <img
            class="button__icon"
            src="./images/profile-image.jpg"
            alt="user profile image"
            class="about__image"
          />
          <h2 id="about__headline" class="about__headline">Keikeidi</h2>
        </div>
        <h3 class="about__headline">About me</h3>
        <p class="about__text">
          Professional overthinker, part-time snack enthusiast, and full-time
          trivia legend (in my own head). I know a little about a lot, a lot
          about nothing, and somehow always forget why I walked into a room.
          🧠✨
        </p>
      </section>
      <section id="overview" class="overview" aria-label="overview">
        <ul class="overview__items">
          <li class="overview__item">
            <a href="index.html" aria-label="home">
              <img
                class="button__icon"
                src="./assets/question.svg"
                alt="questions icon"
              />
              <span>10</span>
            </a>
          </li>
          <li class="overview__item">
            <a href="bookmarks.html" aria-label="bookmarks">
              <img
                class="button__icon"
                src="./assets/bookmark.svg"
                alt="bookmark icon"
              />
              <span>5</span>
            </a>
          </li>
        </ul>
      </section>
      <section id="settings" class="settings">
        <h2 class="settings__headline">Settings</h2>
        <div class="setting">
          <label for="dark-mode" class="setting__label">Dark mode</label>
          <input
            type="checkbox"
            id="dark-mode"
            name="dark-mode"
            role="switch"
            class="setting__input"
          />
        </div>
      </section>
    </main>
    <footer>
      <nav aria-label="Main navigation">
        <ul class="nav">
          <li class="nav__item">
            <a href="index.html" aria-current="page" aria-label="Home"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon"
              >
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                <path
                  d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                />
              </svg>
            </a>
          </li>
          <li class="nav__item">
            <a href="bookmarks.html" aria-label="Bookmarks">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-bookmark preview-icon"
              >
                <path
                  d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"
                />
              </svg>
            </a>
          </li>
          <li class="nav__item">
            <a href="profile.html" aria-label="Profile"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-user-round preview-icon"
              >
                <circle cx="12" cy="8" r="5" />
                <path d="M20 21a8 8 0 0 0-16 0" />
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
